#JDBC Properties
spring.datasource.url=jdbc:mysql://localhost:3306/demeter
spring.datasource.username=dataA
spring.datasource.password=dataA

#Security
#spring.security.user.name=test
#spring.security.user.password=sp123

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


#####
#
# HTTPS configuration
#
#####
# Server web port
server.port=8443
# Enable HTTPS support (only accept HTTPS requests)
server.ssl.enabled=true
# Alias that identifies the key in the key store
server.ssl.key-alias=demeter
# Keystore location
server.ssl.key-store=classpath:demeter-keystore.p12
# Keystore password
server.ssl.key-store-password=secret
# Keystore format
server.ssl.key-store-type=PKCS12

